name: Portable workspace executor qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/portable-workspace-executor-qualification.yml
      - eng/portable-workspace-executor-qualification.fsx
      - eng/portable-workspace-image.py
      - src/FS.GG.Coordination.Orchestration.Execution/**
      - tests/portable-workspace/executor-qualification/**
      - tests/portable-workspace/image/**
  push:
    branches: [main]
    paths:
      - .github/workflows/portable-workspace-executor-qualification.yml
      - eng/portable-workspace-executor-qualification.fsx
      - eng/portable-workspace-image.py
      - src/FS.GG.Coordination.Orchestration.Execution/**
      - tests/portable-workspace/executor-qualification/**
      - tests/portable-workspace/image/**

permissions:
  contents: read

concurrency:
  group: portable-workspace-executor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Preflight decision: this is one linear, secret-free qualification job with no
# fan-out, retry, publication, or shared cache. The existing image helper's
# source/recipe/rootless preflight is the smallest useful check. It runs before
# downloads and the roughly 25-minute image plus executor workload. A separate
# state-machine model would duplicate the literal order without protecting an
# interacting state transition, so the initial preflight investment is capped
# at the hosted setup plus 60 seconds and must fail before image acquisition.
jobs:
  strict-rootless-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_IMAGE: docker.io/library/python@sha256:9bbb8720ae0a24a6ca8dd678bfdf57818fe70caf54c52a53ec01d8db43405056
      PODMAN_ROOT: /tmp/pexr-${{ github.run_id }}-${{ github.run_attempt }}
      PODMAN_RUNROOT: /tmp/pexu-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_STATE: /tmp/pexi-${{ github.run_id }}-${{ github.run_attempt }}
      EXECUTOR_STATE: /tmp/pexe-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_ROOT: /tmp/pexv-${{ github.run_id }}-${{ github.run_attempt }}
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run source, recipe, and rootless capability preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test -f eng/portable-workspace-image.py
          test -f eng/portable-workspace-executor-qualification.fsx
          test -d tests/portable-workspace/executor-qualification/fixture
          command -v podman
          install -d -m 0700 "$IMAGE_STATE" "$EXECUTOR_STATE" "$EVIDENCE_ROOT"
          python3 eng/portable-workspace-image.py preflight \
            --source "$GITHUB_WORKSPACE" \
            --expected-source-revision "$GITHUB_SHA" \
            --state-dir "$IMAGE_STATE" \
            --root "$PODMAN_ROOT" \
            --runroot "$PODMAN_RUNROOT" \
            > "$EVIDENCE_ROOT/image-preflight-result.json"

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400
          global-json-file: global.json

      - name: Build the exact executor assembly
        shell: bash
        run: |
          set -euo pipefail
          project=src/FS.GG.Coordination.Orchestration.Execution/FS.GG.Coordination.Orchestration.Execution.fsproj
          dotnet restore "$project" --locked-mode
          dotnet build "$project" --configuration Debug --no-restore --warnaserror

      - name: Pull only the approved base image digest
        shell: bash
        run: |
          set -euo pipefail
          podman --storage-driver=vfs --root "$PODMAN_ROOT" --runroot "$PODMAN_RUNROOT" \
            pull --platform linux/amd64 "$BASE_IMAGE"

      - name: Build and verify the exact qualified image in the private store
        shell: bash
        run: |
          set -euo pipefail
          python3 eng/portable-workspace-image.py qualify \
            --source "$GITHUB_WORKSPACE" \
            --expected-source-revision "$GITHUB_SHA" \
            --state-dir "$IMAGE_STATE" \
            --root "$PODMAN_ROOT" \
            --runroot "$PODMAN_RUNROOT" \
            > "$EVIDENCE_ROOT/image-qualification-result.json"
          test "$(stat --format=%s "$IMAGE_STATE/candidate.oci.tar")" -le 268435456

      - name: Run the production executor against the qualified image
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(python3 - "$EVIDENCE_ROOT/image-qualification-result.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          result = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest = pathlib.Path(result["buildManifest"])
          candidate = pathlib.Path(result["candidate"])
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == result["buildManifestSha256"]
          assert hashlib.sha256(candidate.read_bytes()).hexdigest() == result["candidateSha256"]
          value = json.loads(manifest.read_text(encoding="utf-8"))
          assert value["schema"] == "fsgg.portable-workspace-local-image/1"
          assert value["image"]["reference"] == result["buildImageReference"]
          assert value["image"]["id"] == result["imageId"]
          exported = json.loads(pathlib.Path(result["manifest"]).read_text(encoding="utf-8"))
          assert exported["image"]["buildDigest"] == value["image"]["digest"]
          assert exported["image"]["reference"] == result["imageReference"]
          print(manifest)
          PY
          )"
          test -f "$manifest"
          dotnet fsi eng/portable-workspace-executor-qualification.fsx -- \
            --fixture tests/portable-workspace/executor-qualification/fixture \
            --image-manifest "$manifest" \
            --state-dir "$EXECUTOR_STATE" \
            --evidence "$EVIDENCE_ROOT/executor-evidence.json" \
            --podman /usr/bin/podman \
            --git /usr/bin/git \
            --tar /usr/bin/tar \
            --root "$PODMAN_ROOT" \
            --runroot "$PODMAN_RUNROOT"

      - name: Require strict executor acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_ROOT/executor-evidence.json" "$EVIDENCE_ROOT/image-qualification-result.json" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          qualification = json.load(open(sys.argv[2], encoding="utf-8"))
          assert evidence["schema"] == "fsgg.portable-workspace-executor-qualification/1"
          assert evidence["imageReference"] == qualification["buildImageReference"]
          assert evidence["imageId"] == qualification["imageId"]
          assert evidence["manifestSha256"] == qualification["buildManifestSha256"]
          assert evidence["outcome"] == "passed"
          assert evidence["strictAcceptance"] is True
          assert evidence["passed"] == 6
          assert evidence["unknown"] == 0
          assert evidence["failed"] == 0
          assert evidence["duplicateOrPendingWithoutRelaunch"] is True
          assert evidence["sourceFenceBeforeWrite"] is True
          assert evidence["preCancelledBeforeLaunch"] is True
          assert evidence["hostEnvironmentInjectionCleared"] is True
          assert evidence["missingImageRefusedBeforeStart"] is True
          assert evidence["overflowArithmeticAccepted"] is True
          assert evidence["interruptedRecoveryNoRelaunch"] is True
          assert evidence["remainingExecutionRoots"] == 0
          assert len(evidence["operations"]) == 6
          assert all(item["outcome"] == "passed" for item in evidence["operations"])
          PY

      - name: Remove exact private runtime state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$EVIDENCE_ROOT"
          containers_file="$EVIDENCE_ROOT/cleanup-containers.txt"
          podman --storage-driver=vfs --root "$PODMAN_ROOT" --runroot "$PODMAN_RUNROOT" \
            container ps --all --quiet > "$containers_file" || true
          mapfile -t containers < "$containers_file"
          if (( ${#containers[@]} > 0 )); then
            podman --storage-driver=vfs --root "$PODMAN_ROOT" --runroot "$PODMAN_RUNROOT" \
              container rm --force "${containers[@]}"
          fi
          podman --storage-driver=vfs --root "$PODMAN_ROOT" --runroot "$PODMAN_RUNROOT" \
            container ps --all --quiet > "$EVIDENCE_ROOT/cleanup-remaining.txt"
          test ! -s "$EVIDENCE_ROOT/cleanup-remaining.txt"
          python3 - "$IMAGE_STATE" "$EXECUTOR_STATE" "$EVIDENCE_ROOT/cleanup-state.json" <<'PY'
          import json
          import pathlib
          import shutil
          import sys

          image_state = pathlib.Path(sys.argv[1])
          executor_state = pathlib.Path(sys.argv[2])
          receipt = pathlib.Path(sys.argv[3])
          candidate = image_state / "candidate.oci.tar"
          if candidate.exists():
              candidate.unlink()
          if executor_state.exists():
              shutil.rmtree(executor_state)
          receipt.write_text(json.dumps({
              "schema": "fsgg.portable-workspace-executor-cleanup/1",
              "candidateRemoved": not candidate.exists(),
              "executorStateRemoved": not executor_state.exists(),
          }, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Retain bounded executor qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portable-workspace-executor-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_ROOT }}/*.json
            ${{ env.EVIDENCE_ROOT }}/cleanup-*.txt
            ${{ env.IMAGE_STATE }}/manifests/*.json
            ${{ env.IMAGE_STATE }}/preflight.json
            ${{ env.IMAGE_STATE }}/runs/*/journal.jsonl
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
