name: Boundary qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: boundary-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-qualification:
    name: boundary-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore the locked graph
        run: dotnet restore FS.GG.Coordination.sln --locked-mode

      - name: Build the solution
        run: dotnet build FS.GG.Coordination.sln --configuration Release --no-restore

      - name: Run tests and negative controls
        run: dotnet test FS.GG.Coordination.sln --configuration Release --no-build --no-restore

      - name: Verify the production dependency graph
        run: dotnet fsi eng/verify-dependencies.fsx -- --root .
