name: FourD typed source constructor

on:
  pull_request:
    paths:
      - .github/workflows/fourd-typed-source.yml
      - eng/fourd-public-provider/typed/**
      - tests/fourd-public-provider/test_native_source.py
      - global.json
      - Directory.*.props
      - Directory.Build.targets
      - nuget.config
  push:
    branches: [main]
    paths:
      - .github/workflows/fourd-typed-source.yml
      - eng/fourd-public-provider/typed/**
      - tests/fourd-public-provider/test_native_source.py
      - global.json
      - Directory.*.props
      - Directory.Build.targets
      - nuget.config

permissions:
  contents: read

concurrency:
  group: fourd-typed-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-constructor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DOTNET_PROCESSOR_COUNT: 2
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.400
          global-json-file: global.json
      # Linear source-only gate. Tests build the existing nonpackable producer into
      # fresh /tmp outputs and exercise its CLI; no native workflow is activated.
      - run: python3 -B tests/fourd-public-provider/test_native_source.py
