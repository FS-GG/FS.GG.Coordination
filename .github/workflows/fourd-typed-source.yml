name: FourD typed native source

on:
  pull_request:
    paths:
      - .github/workflows/fourd-typed-source.yml
      - .github/workflows/fourd-native-producer-publish.yml
      - eng/fourd-public-provider/**
      - tests/fourd-public-provider/**
      - global.json
      - Directory.*.props
      - Directory.Build.targets
      - nuget.config
  push:
    branches: [main]
    paths:
      - .github/workflows/fourd-typed-source.yml
      - .github/workflows/fourd-native-producer-publish.yml
      - eng/fourd-public-provider/**
      - tests/fourd-public-provider/**
      - global.json
      - Directory.*.props
      - Directory.Build.targets
      - nuget.config

permissions:
  contents: read

concurrency:
  group: fourd-typed-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-constructor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_PROCESSOR_COUNT: 2
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check exact runtime preparation before acquiring toolchains
        run: python3 -B tests/fourd-public-provider/test_native_runtime_profile.py
      - name: Stage the exact isolated official compiler and runtime closure
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          root="$(mktemp -d /tmp/fourd-native-runtime.XXXXXXXX)"
          python3 -I -B eng/fourd-public-provider/native_runtime_profile.py stage \
            --archives "$root/archives" --output "$root/runtime" --budget-seconds 240 \
            > "$root/runtime-profile-facts.json"
          echo "DOTNET_ROOT=$root/runtime" >> "$GITHUB_ENV"
          echo "DOTNET_INSTALL_DIR=$root/runtime" >> "$GITHUB_ENV"
          echo "$root/runtime" >> "$GITHUB_PATH"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.8.0
      - name: Compile and exercise actual native producer and capsule IO
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d /tmp/fourd-typed-source.XXXXXXXX)"
          echo "FSGG_FOURD_SOURCE_GATE=$root" >> "$GITHUB_ENV"
          dotnet publish eng/fourd-public-provider/typed/FourD.Typed.fsproj -c Release \
            -o "$root/publish" -p:BaseIntermediateOutputPath="$root/obj/" -p:BaseOutputPath="$root/bin/" --nologo
          export FSGG_FOURD_NATIVE_TEST_COMMAND="[\"$root/publish/FourD.Typed\"]"
          export FSGG_FOURD_NATIVE_CANDIDATE="$root/frozen-candidate"
          host="$(python3 -c 'import pathlib,shutil;print(pathlib.Path(shutil.which("dotnet")).resolve(strict=True))')"
          python3 -B eng/fourd-public-provider/native_publication.py prepare \
            --source "$GITHUB_WORKSPACE" --published "$root/publish" --host "$host" \
            --output "$FSGG_FOURD_NATIVE_CANDIDATE"
          python3 -B tests/fourd-public-provider/test_native_source.py
          python3 -B tests/fourd-public-provider/test_native_protocol.py
          python3 -B tests/fourd-public-provider/test_native_io.py
          python3 -B tests/fourd-public-provider/test_native_publication.py
          python3 -B tests/fourd-public-provider/test_native_cleanup.py
          python3 -B tests/fourd-public-provider/test_native_emergency.py
          python3 -B tests/fourd-public-provider/test_native_gate.py
          npm install --prefix "$root/quint" --ignore-scripts --no-audit --no-fund @informalsystems/quint@0.32.0
          python3 -B tests/fourd-public-provider/qualify_native.py --producer "$root/publish/FourD.Typed" \
            --evidence "$root/evidence" --quint "$root/quint/node_modules/.bin/quint"
      - name: Retain the frozen qualified native producer
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fourd-native-producer-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.FSGG_FOURD_SOURCE_GATE }}/frozen-candidate/fourd-native-producer-linux-x64.tar
            ${{ env.FSGG_FOURD_SOURCE_GATE }}/frozen-candidate/native-producer-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
