              root=E.fromstring(raw);ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
              summary=root.find('t:ResultSummary',ns);c=summary.find('t:Counters',ns) if summary is not None else None
              if c is None or summary.get('outcome')!='Completed' or any(int(c.get(k,'-1'))!=expected for k in ('total','executed','passed')) or any(int(c.get(k,'-1'))!=0 for k in ('failed','error','timeout','aborted','notExecuted')):raise ValueError('fixture population or outcome differs')
              results=root.findall('t:Results/t:UnitTestResult',ns)
