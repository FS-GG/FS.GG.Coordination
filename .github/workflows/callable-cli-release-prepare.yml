              if fresh and (len(passed)!=124 or len(set(passed))!=124):raise ValueError('fresh fixture population or unique names differ')
              required=['real named test:','zero named tests rejected','tool digest mismatch','tool version unsupported','real sampled run','real counterexample preserved','real typecheck','exit zero without evidence rejected','zero count refused','output flood bounded','process deadline','owned child no longer executing']
              if fresh:required+=['public cap above fixed capture allocation outcome','public cap above fixed capture allocation complete stdout','public stderr above fixed stream allocation outcome','public stderr above fixed stream allocation complete stderr','UTF8 BOM excluded from decoded output charge outcome','malformed UTF8 replacement retained outcome','surrogate pairs across reader chunks retained outcome','combined streams share one output limit','2048-byte executable admitted','2049-byte executable refused without probe','2048-byte cwd admitted','2049-byte cwd refused without probe','256-KiB combined request admitted','combined request overflow refuses workload after probe','batch stdin is closed']
              if any(not any(name==needle or name.startswith(needle) for name in passed) for needle in required):raise ValueError('selected real or lifecycle fixture missing')
              if fresh:
                  required_lifecycle=['Quint cancellation reaches actual workload', 'Quint cancellation fixture child is executing', 'Quint caller cancellation returns within observation allowance', 'Quint caller token retains cancellation first cause', 'Quint cancellation known child retired', 'held pipe fixture reaches workload', 'held pipe leader exits before work deadline', 'held pipe recorded child remains executing', 'passing marker and leader exit cannot complete held pipe', 'held pipe observation returns within fixture allowance', 'held pipe work deadline retains timeout first cause', 'held pipe known child retired by fixture']
                  if any(name not in passed for name in required_lifecycle):raise ValueError('selected cancellation or held-pipe fixture missing')
              return passed
          state=pathlib.Path(os.environ['PROC6_STATE']);case=os.environ['CONSUMER_CASE']
