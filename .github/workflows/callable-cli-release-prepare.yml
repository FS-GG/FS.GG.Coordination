          else:fixtures=consumer_fsquint((state/'logs/fixture-0.log').read_bytes(),case.endswith('s1'))
          closure=json.loads((state/'proof/source-closure.json').read_bytes())
          if closure.get('physicalSourceExclusionEstablished') is not True:raise ValueError('source exclusion unestablished')
          result={'schema':'fsgg.coordination.execution-pair-consumer-observation/1','case':case,'source':os.environ['SOURCE_A'],'executor':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'attempt':1,'receiver':os.environ['RECEIVER_SOURCE'],'receiverRepository':os.environ['RECEIVER_REPOSITORY'],'candidateArchiveSha256':os.environ['ARCHIVE_SHA'],'selectedPackageArchiveSha256':os.environ['ARCHIVE_SHA'] if case.endswith('s1') else '6aedfb7e4eda796fdea3fc0326003a6f90f859352d7394d311f4c5d867687819' if case=='sdd-rollback' else None,'historicalOriginalArchiveSha256':'7078f08faed9d8f1e6a7a662fd33c04861a106990db61b184d3e573c413f8c1f' if case=='fsquint-rollback' else None,'originalArtifactReacquired':False if case=='fsquint-rollback' else None,'currentCrossRepoArtifactAccessEstablished':False,'freshPublicSignatureVerification':json.loads((state/'proof/public-signature-verification.json').read_bytes()) if case=='fsquint-rollback' else None,'historicalReceiptSha256':'fc0c5c4f774b7210dbfda88fcbae97759994f36424b9c889c693dcf8d7ac4f3c' if case=='fsquint-rollback' else None,'sourceClosureSha256':hashlib.sha256((state/'proof/source-closure.json').read_bytes()).hexdigest(),'fixtureNames':fixtures,'fixtureCount':len(fixtures),'nativeFixtureInvoked':True,'selectedFixturesPassed':True,'elapsedSeconds':elapsed,'originalWorkSeconds':b['workSeconds'],'ordinaryCommandTimeoutSeconds':90,'pipelineDeadlineQualified':False,'fixtureCleanupObserved':True,'sdkVersion':closure['sdkVersion'],'runtimeFrameworkVersion':closure['runtimeFrameworkVersion'],'dotnetProfileSha256':closure['dotnetProfileSha256'],'fixtureCleanupScope':'selected lifecycle assertions only; no complete descendant census','outerCustodyQualified':False,'hardContainment':False,'networkReachable':True,'hostedJobRetirement':'provider controlled after job; not observed by this receipt','consumerAdoptionAccepted':False,'publicationAuthorized':False}
          raw=json.dumps(result,sort_keys=True).encode()
