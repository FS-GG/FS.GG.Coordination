      - name: Bind receiver identity and cold input roots
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C receiver-source rev-parse HEAD)" = "$RECEIVER_SOURCE"
          if [[ -n "$RECEIVER_TREE" ]]; then test "$(git -C receiver-source rev-parse 'HEAD^{tree}')" = "$RECEIVER_TREE"; fi
          test -z "$(git -C receiver-source status --porcelain)"
          test ! -e "$RUNNER_TEMP/proc6-state"
          mkdir -m 0700 "$RUNNER_TEMP/proc6-state"
          python3 - <<'PY_CONSUMER_ROOTS'
          import hashlib,json,os,pathlib,time
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'proc6-state'
          install=pathlib.Path(os.environ['DOTNET_INSTALL_DIR'])
          if install!=pathlib.Path(os.environ['RUNNER_TEMP'])/'proc6-dotnet' or install.exists() or install.is_symlink():raise ValueError('private SDK destination already exists or differs')
          for name in ('packages','http','cli','tmp','logs','proof'): (root/name).mkdir(mode=0o700)
          # Capture immutable receiver-source lock expectations before SDK, restore or build.
          source=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'receiver-source'
          expected=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'proc6-expected-packages.json').read_bytes())
          # Observe the unchanged SDK-generated Core lock before SDK setup or restore.
          if os.environ['CONSUMER_CASE']=='fsquint-s1':expected['FSharp.Core']={'version':'10.1.401'}
          lock_paths=list(source.rglob('packages.lock.json'))
          if len(lock_paths)>128 or sum(v.stat().st_size for v in lock_paths)>8388608:raise ValueError('source lock observation cap')
          pins=[]
          for path in lock_paths:
              if path.is_symlink() or not path.is_file() or path.stat().st_size>4194304:raise ValueError('unsafe source lock')
              raw=path.read_bytes();doc=json.loads(raw);entries=[]
              for framework,dependencies in doc.get('dependencies',{}).items():
                  for id,row in dependencies.items():
                      if id in expected and row.get('resolved')==expected[id]['version'] and row.get('type') in ('Direct','Transitive'):
                          entries.append({'framework':framework,'packageId':id,'entry':row})
              if entries:pins.append({'path':str(path.relative_to(source)),'sha256':hashlib.sha256(raw).hexdigest(),'entries':entries})
          (root/'proof/source-lock-pins.json').write_text(json.dumps({'receiverSource':os.environ['RECEIVER_SOURCE'],'locks':pins}))
          # One original operation deadline; stage caps below never renew it.
          (root/'budget.json').write_text(json.dumps({'started':time.monotonic(),'workSeconds':600,'cleanupSeconds':30,'reportSeconds':30}))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for key,value in {'NUGET_PACKAGES':root/'packages','NUGET_HTTP_CACHE_PATH':root/'http','DOTNET_CLI_HOME':root/'cli','TMPDIR':root/'tmp','PROC6_STATE':root,'RECEIVER_ROOT':pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'receiver-source'}.items():f.write(str(key)+'='+str(value)+'\n')
