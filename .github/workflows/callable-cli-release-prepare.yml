      - name: Run the fixed installed receiver fixture population
        shell: bash
        run: |
          set -euo pipefail
          cd "$RECEIVER_ROOT"
          mkdir -m 0700 "$PROC6_STATE/proof/results"
          case "$CONSUMER_CASE" in
            sdd-*)
              projects=(tests/FS.GG.SDD.Commands.Tests/FS.GG.SDD.Commands.Tests.fsproj tests/FS.GG.SDD.Commands.Tests/FS.GG.SDD.Commands.Tests.fsproj tests/FS.GG.SDD.Cli.Tests/FS.GG.SDD.Cli.Tests.fsproj tests/FS.GG.SDD.Cli.Tests/FS.GG.SDD.Cli.Tests.fsproj tests/FS.GG.SDD.Acceptance.Tests/FS.GG.SDD.Acceptance.Tests.fsproj)
              filters=('FullyQualifiedName~ChildProcessTests' 'FullyQualifiedName~GitignoreNegationTests' 'FullyQualifiedName~ValidateCommandTests' 'FullyQualifiedName~HelpRenderingTests|FullyQualifiedName~LintCommandTests' 'FullyQualifiedName~dispatch source materializes content verbatim and the file sha matches the advertised') ;;
            fsquint-s1) projects=(tests/FsQuint.Tests/FsQuint.Tests.fsproj) ;;
            fsquint-rollback) projects=(rollback.fsproj) ;;
            *) exit 2 ;;
          esac
          for index in "${!projects[@]}"; do
            remaining="$(python3 - <<'PY'
          import hashlib,json,os,pathlib,time
          b=json.loads((pathlib.Path(os.environ['PROC6_STATE'])/'budget.json').read_text())
          n=int(b['started']+b['workSeconds']-time.monotonic())-5
          if n<=0:raise SystemExit('original consumer budget expired')
          print(min(n,90))
          PY
            )"
            if [[ "$CONSUMER_CASE" = sdd-* ]]; then
              timeout --signal=TERM --kill-after=5s "${remaining}s" "$DOTNET_HOST_PATH" test "${projects[$index]}" -c Debug --no-build --no-restore --disable-build-servers -m:1 --filter "${filters[$index]}" --logger "trx;LogFileName=$index.trx" --results-directory "$PROC6_STATE/proof/results" 2>&1 | head -c 1048577 > "$PROC6_STATE/logs/fixture-$index.log"
            else
              test -x "$QUINT_BIN"
              timeout --signal=TERM --kill-after=5s "${remaining}s" "$DOTNET_HOST_PATH" run --project "${projects[$index]}" -c Release --no-build --no-restore 2>&1 | head -c 1048577 > "$PROC6_STATE/logs/fixture-$index.log"
            fi
            test "$(stat -c %s "$PROC6_STATE/logs/fixture-$index.log")" -le 1048576
          done
      - name: Bind observed fixture results and scoped cleanup limits
        shell: bash
        run: |
          python3 - <<'PY_CONSUMER_RESULTS'
          import hashlib,json,os,pathlib,re,time,xml.etree.ElementTree as E
          def consumer_sdd_expected(case):
