name: callable-cli-release-prepare

on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact reviewed source commit
        required: true
        type: string
      preparation_mode:
        description: Select one exclusive portable, CLI-only or routine Execution pair candidate
        required: true
        default: portable
        type: choice
        options:
          - portable
          - cli-only
          - execution-pair
          - execution-pair-installed
      version:
        description: Proposed package version (preparation only)
        required: true
        default: 0.2.1
        type: string

      executor_source:
        description: Exact reviewed protected executor revision (installed mode only)
        required: false
        type: string
      candidate_run_id:
        description: Original successful Execution pair preparation run (installed mode only)
        required: false
        type: string
      candidate_artifact_id:
        description: Original immutable pair artifact (installed mode only)
        required: false
        type: string
      candidate_archive_sha256:
        description: Reviewed original archive SHA256 (installed mode only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: callable-cli-release-prepare-${{ inputs.source }}
  cancel-in-progress: false

# Preflight decision: this is one linear, secret-free preparation job. Static
# source, package, recipe, rootless-runtime and output-collision checks run
# before the costly image build and six-operation qualification. There is no
# fan-out, retry, publication effect or shared mutable cache to justify a
# separate state-machine model. Reassess if those interactions are added.
jobs:
  prepare:
    if: inputs.preparation_mode == 'portable'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_PROCESSOR_COUNT: 4
      BASE_IMAGE: docker.io/library/python@sha256:9bbb8720ae0a24a6ca8dd678bfdf57818fe70caf54c52a53ec01d8db43405056
      BUILD_ROOT: /tmp/pw-build-${{ github.run_id }}-${{ github.run_attempt }}
      BUILD_RUNROOT: /tmp/pw-build-run-${{ github.run_id }}-${{ github.run_attempt }}
      LOAD_ROOT: /tmp/pw-load-${{ github.run_id }}-${{ github.run_attempt }}
      LOAD_RUNROOT: /tmp/pw-load-run-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_STATE: /tmp/pw-image-${{ github.run_id }}-${{ github.run_attempt }}
      EXECUTOR_STATE: /tmp/pw-executor-${{ github.run_id }}-${{ github.run_attempt }}
      PACKAGED_STATE: /tmp/pw-package-${{ github.run_id }}-${{ github.run_attempt }}
      CANDIDATE_OUTPUT: /tmp/pw-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      ARTIFACT_ROOT: /tmp/pw-artifact-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_OUTPUT: /tmp/pw-release-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_ROOT: /tmp/pw-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run bounded source recipe and rootless preflight
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_VERSION" = 0.2.1
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          test -z "$(git status --porcelain)"
          test -f eng/callable-cli-release.fsx
          test -f eng/portable-workspace-release.fsx
          test -f eng/run-packaged-portable-workspace-qualification.py
          command -v podman
          install -d -m 0700 "$IMAGE_STATE" "$EXECUTOR_STATE" "$EVIDENCE_ROOT" "$ARTIFACT_ROOT/evidence/diagnostics"
          printf '%s\n' preflight > "$ARTIFACT_ROOT/evidence/diagnostics/last-stage.txt"
          python3 eng/portable-workspace-image.py preflight \
            --source "$GITHUB_WORKSPACE" \
            --expected-source-revision "$CANDIDATE_SOURCE" \
            --state-dir "$IMAGE_STATE" \
            --root "$BUILD_ROOT" \
            --runroot "$BUILD_RUNROOT" \
            > "$EVIDENCE_ROOT/image-preflight-result.json"

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore the exact locked source
        run: dotnet restore FS.GG.Coordination.sln --locked-mode

      - name: Prepare deterministic CLI package without effect authority
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' package > "$ARTIFACT_ROOT/evidence/diagnostics/last-stage.txt"
          dotnet fsi eng/callable-cli-release.fsx prepare \
            --source "$CANDIDATE_SOURCE" \
            --version "$CANDIDATE_VERSION" \
            --output "$CANDIDATE_OUTPUT"

      - name: Build and retain the exact pinned OCI archive
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          printf '%s\n' image-build-export > "$ARTIFACT_ROOT/evidence/diagnostics/last-stage.txt"
          podman --storage-driver=vfs --root "$BUILD_ROOT" --runroot "$BUILD_RUNROOT" \
            pull --platform linux/amd64 "$BASE_IMAGE"
          python3 eng/portable-workspace-image.py qualify \
            --source "$GITHUB_WORKSPACE" \
            --expected-source-revision "$CANDIDATE_SOURCE" \
            --state-dir "$IMAGE_STATE" \
            --root "$BUILD_ROOT" \
            --runroot "$BUILD_RUNROOT" \
            > "$EVIDENCE_ROOT/image-qualification-result.json"
          test "$(stat --format=%s "$IMAGE_STATE/candidate.oci.tar")" -le 268435456

      - name: Load retained bytes into a fresh private store and run packaged executor
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' fresh-load-qualification > "$ARTIFACT_ROOT/evidence/diagnostics/last-stage.txt"
          package="$CANDIDATE_OUTPUT/FS.GG.Coordination.Cli.$CANDIDATE_VERSION.nupkg"
          package_sha="$(jq -r .packageSha256 "$CANDIDATE_OUTPUT/callable-cli-release-manifest.json")"
          image_manifest="$(jq -r .manifest "$EVIDENCE_ROOT/image-qualification-result.json")"
          install -d -m 0700 "$LOAD_ROOT" "$LOAD_RUNROOT" "$PACKAGED_STATE"
          podman --storage-driver=vfs --root "$LOAD_ROOT" --runroot "$LOAD_RUNROOT" \
            load --input "$IMAGE_STATE/candidate.oci.tar"
          python3 eng/run-packaged-portable-workspace-qualification.py \
            --package "$package" \
            --expected-package-sha256 "$package_sha" \
            --script eng/portable-workspace-executor-qualification.fsx \
            --work-dir "$PACKAGED_STATE" \
            --receipt "$EVIDENCE_ROOT/packaged-qualification.json" \
            -- \
            --fixture tests/portable-workspace/executor-qualification/fixture \
            --image-manifest "$image_manifest" \
            --state-dir "$EXECUTOR_STATE" \
            --evidence "$EVIDENCE_ROOT/executor-evidence.json" \
            --podman /usr/bin/podman \
            --git /usr/bin/git \
            --tar /usr/bin/tar \
            --root "$LOAD_ROOT" \
            --runroot "$LOAD_RUNROOT"
          python3 - "$EVIDENCE_ROOT/executor-evidence.json" "$EVIDENCE_ROOT/packaged-qualification.json" "$package_sha" <<'PY'
          import json, sys
          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          packaged = json.load(open(sys.argv[2], encoding="utf-8"))
          assert evidence["outcome"] == "passed" and evidence["strictAcceptance"] is True
          assert (evidence["passed"], evidence["failed"], evidence["unknown"]) == (6, 0, 0)
          assert evidence["remainingExecutionRoots"] == 0
          assert packaged["packageSha256"] == sys.argv[3]
          assert packaged["qualificationExitCode"] == 0
          assert packaged["publicationAuthorized"] is False
          assert packaged["activationAuthorized"] is False
          PY

      - name: Construct and verify finite release assets
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' release-assets > "$ARTIFACT_ROOT/evidence/diagnostics/last-stage.txt"
          package="$CANDIDATE_OUTPUT/FS.GG.Coordination.Cli.$CANDIDATE_VERSION.nupkg"
          image_manifest="$(jq -r .manifest "$EVIDENCE_ROOT/image-qualification-result.json")"
          dotnet fsi eng/portable-workspace-release.fsx prepare \
            --source "$CANDIDATE_SOURCE" --version "$CANDIDATE_VERSION" \
            --package "$package" \
            --package-manifest "$CANDIDATE_OUTPUT/callable-cli-release-manifest.json" \
            --image-archive "$IMAGE_STATE/candidate.oci.tar" \
            --image-manifest "$image_manifest" \
            --image-qualification "$EVIDENCE_ROOT/image-qualification-result.json" \
            --executor-evidence "$EVIDENCE_ROOT/executor-evidence.json" \
            --output "$RELEASE_OUTPUT"
          cp "$image_manifest" "$CANDIDATE_OUTPUT/portable-workspace-image-manifest.json"
          cp "$EVIDENCE_ROOT/image-qualification-result.json" "$CANDIDATE_OUTPUT/portable-workspace-image-qualification.json"
          cp "$EVIDENCE_ROOT/executor-evidence.json" "$CANDIDATE_OUTPUT/portable-workspace-executor-evidence.json"
          cp "$EVIDENCE_ROOT/packaged-qualification.json" "$CANDIDATE_OUTPUT/portable-workspace-packaged-qualification.json"
          install -d -m 0700 "$ARTIFACT_ROOT/evidence"
          cp "$CANDIDATE_OUTPUT"/* "$ARTIFACT_ROOT/"
          cp "$RELEASE_OUTPUT"/* "$ARTIFACT_ROOT/"
          cp "$EVIDENCE_ROOT"/*.json "$ARTIFACT_ROOT/evidence/"

      - name: Retain bounded preparation diagnostics
        if: always()
        shell: bash
        env:
          PREPARATION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$ARTIFACT_ROOT/evidence/diagnostics"
          python3 - "$PREPARATION_STATUS" "$ARTIFACT_ROOT/evidence/diagnostics" "$EVIDENCE_ROOT" "$IMAGE_STATE" <<'PY'
          import hashlib, json, pathlib, shutil, stat, sys
          status, destination, *roots = sys.argv[1:]
          destination = pathlib.Path(destination)
          retained = []
          for root_value in roots:
              root = pathlib.Path(root_value)
              if not root.is_dir() or root.is_symlink():
                  continue
              candidates = {source for pattern in ("*.json", "preflight.json", "manifests/*.json", "runs/*/journal.jsonl") for source in root.glob(pattern)}
              for source in sorted(candidates):
                  relative = source.relative_to(root)
                  info = source.lstat()
                  if not stat.S_ISREG(info.st_mode) or source.is_symlink() or source.suffix not in (".json", ".jsonl") or info.st_size > 1048576:
                      continue
                  name = f"{root.name}--{'--'.join(relative.parts)}"
                  target = destination / name
                  if not target.exists():
                      shutil.copyfile(source, target)
                  retained.append({"file":name,"bytes":target.stat().st_size,"sha256":hashlib.sha256(target.read_bytes()).hexdigest()})
          (destination / "preparation-state.json").write_text(json.dumps({
              "schema":"fsgg.portable-workspace-preparation-diagnostics/1",
              "jobStatus":status,
              "sourceOnly":True,
              "qualificationPassed": status == "success",
              "retained":retained,
          },sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY

      - name: Remove exact private runtime state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for pair in "$BUILD_ROOT:$BUILD_RUNROOT" "$LOAD_ROOT:$LOAD_RUNROOT"; do
            root="${pair%%:*}"
            runroot="${pair#*:}"
            mapfile -t containers < <(podman --storage-driver=vfs --root "$root" --runroot "$runroot" container ps --all --quiet || true)
            if (( ${#containers[@]} > 0 )); then
              podman --storage-driver=vfs --root "$root" --runroot "$runroot" container rm --force "${containers[@]}"
            fi
            test -z "$(podman --storage-driver=vfs --root "$root" --runroot "$runroot" container ps --all --quiet)"
            podman --storage-driver=vfs --root "$root" --runroot "$runroot" system reset --force
          done
          owned=("$BUILD_ROOT" "$BUILD_RUNROOT" "$LOAD_ROOT" "$LOAD_RUNROOT" "$IMAGE_STATE" "$EXECUTOR_STATE" "$PACKAGED_STATE" "$CANDIDATE_OUTPUT" "$RELEASE_OUTPUT" "$EVIDENCE_ROOT")
          for path in "${owned[@]}"; do
            case "$path" in
              /tmp/pw-*-${{ github.run_id }}-${{ github.run_attempt }}) ;;
              *) echo "refusing cleanup outside exact run scope: $path" >&2; exit 1 ;;
            esac
            test ! -L "$path"
            podman unshare /usr/bin/rm -rf -- "$path"
            test ! -e "$path"
          done
          python3 - "${owned[@]}" "$ARTIFACT_ROOT/evidence/cleanup-state.json" <<'PY'
          import json, pathlib, sys
          removed = {pathlib.Path(value).name + "Removed": not pathlib.Path(value).exists() for value in sys.argv[1:-1]}
          assert all(removed.values())
          receipt = pathlib.Path(sys.argv[-1])
          receipt.parent.mkdir(parents=True, mode=0o700, exist_ok=True)
          receipt.write_text(json.dumps({
              "schema":"fsgg.portable-workspace-release-cleanup/1",
              **removed,
          },sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY

      - name: Retain the coherent candidate and bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: callable-cli-${{ inputs.source }}
          path: ${{ env.ARTIFACT_ROOT }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  cli_only:
    if: inputs.preparation_mode == 'cli-only'
    name: Prepare the CLI-only successor without publication
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_PROCESSOR_COUNT: 4
      CANDIDATE_OUTPUT: /tmp/coord-cli-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact CLI source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind CLI-only source and prospective version
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_VERSION" = 0.3.0
          test "$CANDIDATE_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SOURCE"
          test -z "$(git status --porcelain)"
          test ! -e "$CANDIDATE_OUTPUT"
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Prepare and install the exact CLI package
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dotnet restore FS.GG.Coordination.sln --locked-mode
          dotnet fsi eng/callable-cli-release.fsx prepare \
            --source "$CANDIDATE_SOURCE" --version "$CANDIDATE_VERSION" --output "$CANDIDATE_OUTPUT"
          dotnet fsi eng/callable-cli-release.fsx verify \
            --source "$CANDIDATE_SOURCE" --version "$CANDIDATE_VERSION" --output "$CANDIDATE_OUTPUT"
          test "$(find "$CANDIDATE_OUTPUT" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 2
          test -f "$CANDIDATE_OUTPUT/FS.GG.Coordination.Cli.0.3.0.nupkg"
          test -f "$CANDIDATE_OUTPUT/callable-cli-release-manifest.json"
      - name: Retain the original CLI-only candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: callable-cli-only-${{ inputs.source }}
          path: ${{ env.CANDIDATE_OUTPUT }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  execution_pair:
    if: inputs.preparation_mode == 'execution-pair'
    name: Prepare the routine Execution pair without publication
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_PROCESSOR_COUNT: 4
      CANDIDATE_OUTPUT: /tmp/coord-execution-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact pair source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind protected pair source and prospective version
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_VERSION" = 0.2.0
          test "$CANDIDATE_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SOURCE"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$CANDIDATE_SOURCE"
          test -z "$(git status --porcelain)"
          test ! -e "$CANDIDATE_OUTPUT"
      - name: Run actual inert pair guards before costly preparation
        run: python3 tests/portable-workspace/release/test_execution_pair_release.py
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Prepare and verify the exact two library packages
        shell: bash
        env:
          CANDIDATE_SOURCE: ${{ inputs.source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          dotnet fsi eng/callable-cli-release.fsx check-profile --profile execution-pair \
            --source "$CANDIDATE_SOURCE" --version "$CANDIDATE_VERSION" --output "$CANDIDATE_OUTPUT"
          dotnet restore src/FS.GG.Execution.Processes/FS.GG.Execution.Processes.fsproj --locked-mode
          dotnet fsi eng/callable-cli-release.fsx prepare --profile execution-pair \
            --source "$CANDIDATE_SOURCE" --version "$CANDIDATE_VERSION" --output "$CANDIDATE_OUTPUT"
          dotnet fsi eng/callable-cli-release.fsx verify --profile execution-pair \
            --source "$CANDIDATE_SOURCE" --version "$CANDIDATE_VERSION" --output "$CANDIDATE_OUTPUT"
      - name: Retain the original pair candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: execution-pair-${{ inputs.source }}
          path: ${{ env.CANDIDATE_OUTPUT }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  execution_pair_installed:
    if: inputs.preparation_mode == 'execution-pair-installed'
    name: Verify original Execution pair installed load without publication
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_PROCESSOR_COUNT: 4
      CANDIDATE_OUTPUT: /tmp/coord-execution-installed-${{ github.run_id }}-${{ github.run_attempt }}
      READBACK_OUTPUT: /tmp/coord-execution-installed-proof-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out exact protected executor without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind original candidate and nonpublishing executor inputs
        shell: bash
        env:
          SOURCE_A: ${{ inputs.source }}
          EXECUTOR_SOURCE: ${{ inputs.executor_source }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT: ${{ inputs.candidate_artifact_id }}
          ARCHIVE_SHA: ${{ inputs.candidate_archive_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = FS-GG/FS.GG.Coordination
          [[ "$SOURCE_A" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXECUTOR_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$EXECUTOR_SOURCE" = "$GITHUB_SHA"
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$CANDIDATE_ARTIFACT" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$ARCHIVE_SHA" =~ ^[0-9a-f]{64}$ ]]
          test "$CANDIDATE_VERSION" = 0.2.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$SOURCE_A" "$GITHUB_SHA"
          changed_paths="$(git diff --name-only "$SOURCE_A" "$GITHUB_SHA")"
          while IFS= read -r path; do
            test -z "$path" && continue
            case "$path" in
              .github/workflows/callable-cli-release-prepare.yml|.github/workflows/callable-cli-release-publish.yml|eng/test-callable-cli-installed-harness.py|tests/portable-workspace/release/test_execution_pair_release.py|evidence/github-substrate-v2/gs2-06-7/execution-pins-extension.json) ;;
              *) echo "::error::candidate-to-executor changed package or unsupported source: $path"; exit 1 ;;
            esac
          done <<< "$changed_paths"
          test -z "$(git status --porcelain)"
          test ! -e "$CANDIDATE_OUTPUT"
          test ! -e "$READBACK_OUTPUT"
          mkdir "$CANDIDATE_OUTPUT" "$READBACK_OUTPUT"
          for name in SOURCE_A CANDIDATE_RUN CANDIDATE_ARTIFACT ARCHIVE_SHA; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
      - name: Run actual shared pair guards before installed qualification
        run: python3 tests/portable-workspace/release/test_execution_pair_release.py
      - name: Authenticate the original pair archive without repacking
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$READBACK_OUTPUT/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/1/jobs?per_page=100" > "$READBACK_OUTPUT/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT" > "$READBACK_OUTPUT/artifact.json"
          curl --fail --silent --show-error --location --max-time 120 --max-filesize 50331648 --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --output "$READBACK_OUTPUT/candidate.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT/zip"
          python3 - <<'PY_PAIR_INSTALLED_BINDINGS'
          import hashlib,json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['READBACK_OUTPUT'])
          archive=root/'candidate.zip'
          assert 0<archive.stat().st_size<=50331648
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==os.environ['ARCHIVE_SHA']
          with zipfile.ZipFile(archive) as z:
              entry=z.getinfo('execution-pair-release-manifest.json')
              assert 0<entry.file_size<=1048576
              raw=z.read(entry)
          manifest=json.loads(raw)
          assert manifest['sourceCommit']==os.environ['SOURCE_A']
          jobs=json.loads((root/'jobs.json').read_bytes())
          selected=[job for job in jobs['jobs'] if job['name']=='Prepare the routine Execution pair without publication']
          assert len(selected)==1
          admission=json.load(open('eng/execution-pair-release-admission.json'))
          assert admission['enabled'] is False
          admission.update(source=os.environ['SOURCE_A'],tree=manifest['sourceTree'],protectedMerge=os.environ['SOURCE_A'],runId=int(os.environ['CANDIDATE_RUN']),jobId=selected[0]['id'],artifactId=int(os.environ['CANDIDATE_ARTIFACT']),archiveSha256=os.environ['ARCHIVE_SHA'],manifestSha256=hashlib.sha256(raw).hexdigest(),packages={row['packageId']:row['sha256'] for row in manifest['packages']})
          # This is the existing disabled admission shape, bound only for offline
          # artifact verification. It supplies no namespace or effect capability.
          (root/'candidate-bindings.json').write_text(json.dumps(admission))
          PY_PAIR_INSTALLED_BINDINGS
          python3 eng/test-callable-cli-installed-harness.py --execution-pair-artifact \
            "$READBACK_OUTPUT/candidate-bindings.json" "$READBACK_OUTPUT" "$CANDIDATE_OUTPUT"
      - name: Set up the pinned .NET SDK for package-only installed load
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Verify original payload and actual isolated compiler and runtime
        shell: bash
        run: |
          set -euo pipefail
          dotnet fsi eng/callable-cli-release.fsx verify --profile execution-pair \
            --source "$SOURCE_A" --version 0.2.0 --output "$CANDIDATE_OUTPUT"
          python3 eng/test-callable-cli-installed-harness.py --execution-pair \
            "$CANDIDATE_OUTPUT" candidate "$READBACK_OUTPUT/candidate-load.json"
      - name: Retain original installed proof and candidate identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: execution-pair-installed-${{ inputs.source }}-${{ github.run_id }}
          path: ${{ env.READBACK_OUTPUT }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
