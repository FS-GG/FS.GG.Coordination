# Generated by eng/generate-bootstrap-workflow.fsx from eng/bootstrap-qualification-plan.json.
# Edit the plan, not this projection.
name: Bootstrap qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bootstrap-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-build:
    name: deterministic-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: /tmp/fsgg-nuget-packages
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore the exact dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/fsgg-nuget-packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/packages.lock.json') }}
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/deterministic-build.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deterministic-build
          path: ${{ runner.temp }}/deterministic-build/protocol.dll
          if-no-files-found: error

  compiler-and-tests:
    name: compiler-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: /tmp/fsgg-nuget-packages
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore the exact dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/fsgg-nuget-packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/packages.lock.json') }}
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/compiler-and-tests.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-and-tests
          path: ${{ runner.temp }}/compiler-and-tests/architecture.trx
          if-no-files-found: error

  canonical-quint:
    name: canonical-quint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUGET_PACKAGES: /tmp/fsgg-${{ github.run_id }}-nuget-canonical-quint
      FSGG_QUINT_RECEIPT: /tmp/fsgg-${{ github.run_id }}-canonical-quint/qualification.json
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/canonical-quint.sh
      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-quint
          path: ${{ env.FSGG_QUINT_RECEIPT }}
          if-no-files-found: error

  dependency-and-security:
    name: dependency-and-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: /tmp/fsgg-${{ github.run_id }}-nuget-dependency-and-security
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/dependency-and-security.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-and-security
          path: ${{ runner.temp }}/dependency-and-security/vulnerability-report.json
          if-no-files-found: error

  package-install-smoke:
    name: package-install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: /tmp/fsgg-nuget-packages
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Restore the exact dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/fsgg-nuget-packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', '**/packages.lock.json') }}
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/package-install-smoke.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-install-smoke
          path: ${{ runner.temp }}/package-install-smoke/FS.GG.Coordination.Protocol.0.0.0-bootstrap.nupkg
          if-no-files-found: error

  bootstrap-recovery:
    name: bootstrap-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/bootstrap-recovery.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bootstrap-recovery
          path: ${{ runner.temp }}/bootstrap-recovery/result.json
          if-no-files-found: error

  evidence-manifest:
    name: evidence-manifest
    needs: [deterministic-build, compiler-and-tests, canonical-quint, dependency-and-security, package-install-smoke, bootstrap-recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NUGET_PACKAGES: /tmp/fsgg-${{ github.run_id }}-nuget-evidence-manifest
      FSGG_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Download all prerequisite evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/bootstrap-artifacts
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/evidence-manifest.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bootstrap-evidence-manifest
          path: ${{ runner.temp }}/bootstrap-evidence.json
          if-no-files-found: error
