# Generated by eng/generate-bootstrap-workflow.fsx from eng/bootstrap-qualification-plan.json.
# Edit the plan, not this projection.
name: Bootstrap qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: bootstrap-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse-decision:
    name: reuse-decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      route: ${{ steps.decide.outputs.route }}
      prior-run-id: ${{ steps.decide.outputs.prior-run-id }}
      subject-sha: ${{ steps.decide.outputs.subject-sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      FSGG_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FSGG_CURRENT_RUN_ID: ${{ github.run_id }}
      FSGG_REPOSITORY: ${{ github.repository }}
      FSGG_RUNNER_TEMP: /tmp/fsgg-${{ github.run_id }}-reuse
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Select the exact-head qualification route
        id: decide
        run: bash eng/bootstrap-gates/reuse-decision.sh
      - name: Upload the qualification route receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reuse-decision
          path: ${{ env.FSGG_RUNNER_TEMP }}/decision.json
          if-no-files-found: error

  deterministic-build:
    name: deterministic-build
    needs: [reuse-decision]
    if: ${{ needs.reuse-decision.outputs.route == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/deterministic-build.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deterministic-build
          path: ${{ runner.temp }}/deterministic-build/protocol.dll
          if-no-files-found: error

  compiler-and-tests:
    name: compiler-and-tests
    needs: [reuse-decision]
    if: ${{ needs.reuse-decision.outputs.route == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/compiler-and-tests.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compiler-and-tests
          path: ${{ runner.temp }}/compiler-and-tests/architecture.trx
          if-no-files-found: error

  canonical-quint:
    name: canonical-quint
    needs: [reuse-decision]
    if: ${{ needs.reuse-decision.outputs.route == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NUGET_PACKAGES: /tmp/fsgg-${{ github.run_id }}-nuget-canonical-quint
      FSGG_QUINT_RECEIPT: /tmp/fsgg-${{ github.run_id }}-canonical-quint/qualification.json
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/canonical-quint.sh
      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canonical-quint
          path: ${{ env.FSGG_QUINT_RECEIPT }}
          if-no-files-found: error

  dependency-and-security:
    name: dependency-and-security
    needs: [reuse-decision]
    if: ${{ needs.reuse-decision.outputs.route == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: /tmp/fsgg-${{ github.run_id }}-nuget-dependency-and-security
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/dependency-and-security.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-and-security
          path: ${{ runner.temp }}/dependency-and-security/vulnerability-report.json
          if-no-files-found: error

  package-install-smoke:
    name: package-install-smoke
    needs: [reuse-decision]
    if: ${{ needs.reuse-decision.outputs.route == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/package-install-smoke.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: package-install-smoke
          path: ${{ runner.temp }}/package-install-smoke/FS.GG.Coordination.Protocol.0.0.0-bootstrap.nupkg
          if-no-files-found: error

  bootstrap-recovery:
    name: bootstrap-recovery
    needs: [reuse-decision]
    if: ${{ needs.reuse-decision.outputs.route == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/bootstrap-recovery.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bootstrap-recovery
          path: ${{ runner.temp }}/bootstrap-recovery/result.json
          if-no-files-found: error

  evidence-manifest:
    name: evidence-manifest
    needs: [reuse-decision, deterministic-build, compiler-and-tests, canonical-quint, dependency-and-security, package-install-smoke, bootstrap-recovery]
    if: ${{ always() && needs.reuse-decision.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NUGET_PACKAGES: /tmp/fsgg-${{ github.run_id }}-nuget-evidence-manifest
      FSGG_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FSGG_QUALIFICATION_SUBJECT_SHA: ${{ needs.reuse-decision.outputs.subject-sha }}
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Download the current route receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reuse-decision
          path: ${{ runner.temp }}/bootstrap-decision
      - name: Download current execution evidence
        if: ${{ needs.reuse-decision.outputs.route == 'execute' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/bootstrap-artifacts
      - name: Download selected prior evidence
        if: ${{ needs.reuse-decision.outputs.route == 'reuse' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ needs.reuse-decision.outputs.prior-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-bootstrap-artifacts
      - name: Run the stable qualification gate
        run: bash eng/bootstrap-gates/evidence-manifest.sh
      - name: Upload qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bootstrap-evidence-manifest-${{ needs.reuse-decision.outputs.subject-sha }}
          path: ${{ runner.temp }}/bootstrap-evidence.json
          if-no-files-found: error
