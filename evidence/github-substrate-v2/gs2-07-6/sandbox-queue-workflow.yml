name: GS2-07.6 queue pilot

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  queue-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Bind exact hosted heads
        run: |
          set -euo pipefail
          test -n "$GITHUB_SHA"
          printf 'event=%s head=%s ref=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$GITHUB_REF"
      - name: Hold the first merge group for forward-base movement
        if: github.event_name == 'merge_group'
        run: sleep 45
  queue-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Execute the grown required check
        run: |
          set -euo pipefail
          printf 'grown-check event=%s head=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            test -f gs2-07-6-forward-base.txt
          fi
      - name: Retain exact-head hosted proof
        if: github.event_name == 'merge_group' && success()
        env:
          REPOSITORY_ID: "1353050537"
        run: |
          jq -n -c \
            --argjson schemaVersion 1 \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson repositoryId "$REPOSITORY_ID" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg mergeGroupHeadSha "$GITHUB_SHA" \
            --arg fullRef "$GITHUB_REF" \
            --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg check "queue-growth" \
            --arg disposition "hosted-check-succeeded" \
            '{schemaVersion:$schemaVersion,repository:$repository,repositoryId:$repositoryId,runId:$runId,mergeGroupHeadSha:$mergeGroupHeadSha,fullRef:$fullRef,workflowSha:$workflowSha,event:$event,requiredCheck:$check,disposition:$disposition}' > hosted-proof.json
      - name: Upload exact-head hosted proof
        if: github.event_name == 'merge_group' && success()
        uses: actions/upload-artifact@v4
        with:
          name: gs2-07-6-${{ github.run_id }}
          path: hosted-proof.json
          if-no-files-found: error
          retention-days: 90
